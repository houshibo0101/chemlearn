name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试与启动冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 单元测试
        working-directory: backend
        run: pytest -q
      - name: 启动冒烟（健康检查 + 登录 + 题库）
        working-directory: backend
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite+aiosqlite:///$(pwd)/smoke.db"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health; echo
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            | python -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          test -n "$TOKEN" && echo "登录成功，token 长度 ${#TOKEN}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:8000/api/v1/questions?page=1")
          echo "题库接口 $code"; [ "$code" = "200" ]
