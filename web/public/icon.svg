    <!-- 气泡 -->
    <circle cx="-20" cy="70" r="8" fill="rgba(255,255,255,0.6)"/>
    <circle cx="25" cy="85" r="6" fill="rgba(255,255,255,0.5)"/>
    <circle cx="0" cy="55" r="5" fill="rgba(255,255,255,0.4)"/>
    <!-- 瓶口 -->
    <rect x="-36" y="-150" width="72" height="16" rx="6" fill="rgba(255,255,255,0.95)"/>
  </g>
  <!-- 原子装饰 -->
  <circle cx="100" cy="100" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="412" cy="120" r="4" fill="rgba(255,255,255,0.5)"/>
