# ChemLearn nginx 性能优化配置
# 在主配置文件中 include 这个文件，或者把内容放到 server 块里

# gzip 压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# 静态资源缓存
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# HTML不缓存（防止更新后用户看到旧版本）
location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
